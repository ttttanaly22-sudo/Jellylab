<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JellyLab Home</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f3f7fb; color: #1d2b3a; }
        .wrap { max-width: 900px; margin: 80px auto; padding: 24px; }
        h1 { text-align: center; margin-bottom: 24px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; }
        .card { display: block; text-decoration: none; color: inherit; background: white; border-radius: 16px; padding: 30px 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); text-align: center; }
        .card h2 { margin: 0 0 10px; font-size: 28px; }
        .card p { margin: 0; color: #53657a; }
        .jelly { border-top: 6px solid #2d6cdf; }
        .micro { border-top: 6px solid #1fa67a; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>JellyLab / 顕微鏡</h1>
        <div class="cards">
            <a class="card jelly" href="/jellylab">
                <h2>JellyLab</h2>
                <p>監視・撮影・画像管理</p>
            </a>
            <a class="card micro" href="/microscope">
                <h2>顕微鏡</h2>
                <p>簡易撮影モード</p>
            </a>
        </div>
    </div>
</body>
</html>
