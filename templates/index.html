<script>


const labels = [];

const tempData = [];

const luxData = [];





function createLineChart(canvas, series, title, minValue, maxValue){

    const context = canvas.getContext("2d");

    return {
        update(){
            if(!context){
                throw new Error("Canvas 2D context is unavailable");
            }

            const width = canvas.clientWidth || 900;
            const height = canvas.clientHeight || 320;
            const scale = window.devicePixelRatio || 1;

            canvas.width = Math.round(width * scale);
            canvas.height = Math.round(height * scale);
            context.setTransform(scale, 0, 0, scale, 0, 0);
            context.clearRect(0, 0, width, height);

            const left = 52;
            const right = width - 12;
            const top = 28;
            const bottom = height - 28;
            const plotWidth = right - left;
            const plotHeight = bottom - top;

            context.font = "12px sans-serif";
            context.textBaseline = "middle";
            context.fillStyle = "#333";
            context.textAlign = "left";
            context.fillText(title, left, 12);

            for(let tick = 0; tick <= 5; tick++){
                const ratio = tick / 5;
                const y = top + plotHeight * ratio;
                const value = maxValue - (maxValue - minValue) * ratio;

                context.strokeStyle = "#ddd";
                context.beginPath();
                context.moveTo(left, y);
                context.lineTo(right, y);
                context.stroke();

                context.textAlign = "right";
                context.fillStyle = "#555";
                context.fillText(value.toFixed(0), left - 8, y);
            }

            context.strokeStyle = "#2878b5";
            context.lineWidth = 2;
            context.beginPath();

            let drawing = false;
            series.forEach((value, index) => {
                if(value == null || !Number.isFinite(Number(value))){
                    drawing = false;
                    return;
                }

                const x = series.length <= 1
                    ? left + plotWidth / 2
                    : left + plotWidth * index / (series.length - 1);
                const ratio = (Number(value) - minValue) / (maxValue - minValue);
                const y = bottom - Math.max(0, Math.min(1, ratio)) * plotHeight;

                if(drawing){
                    context.lineTo(x, y);
                }else{
                    context.moveTo(x, y);
                    drawing = true;
                }
            });

            context.stroke();
        }
    };
}

const tempChart = createLineChart(
    document.getElementById("tempChart"),
    tempData,
    "Temperature (℃)",
    -5,
    40
);

const luxChart = createLineChart(
    document.getElementById("luxChart"),
    luxData,
    "Light (lx)",
    0,
    1000
);








// ==========================
// Capture
// ==========================


async function captureImage(){


const dish =
document.getElementById("dish").value;


const polyp =
document.getElementById("polyp").value;



let label="";



if(
document.getElementById("useLabel").checked
){

label=dish+polyp;

}



const result =
document.getElementById("captureResult");



result.textContent =
"撮影中...";



const response =
await fetch(
"/capture?label="+label
);



if(!response.ok){


const data =
await response.json();


result.textContent =
"⚠ " + data.message;


document.getElementById("cameraStatus")
.textContent =
"エラー";


return;


}



const data =
await response.json();


result.textContent =
"✅ "+data.filename;


// ダウンロード
const link = document.createElement("a");

link.href =
"/images/" + data.filename;

link.download =
data.filename;


document.body.appendChild(link);

link.click();

document.body.removeChild(link);

document.getElementById("cameraStatus")
.textContent =
"正常";


}








// ==========================
// Status
// ==========================


async function updateStatus(){

let data;
try {
    const response = await fetch("/status");
    if(!response.ok){
        throw new Error(`/status returned HTTP ${response.status}`);
    }
    data = await response.json();
} catch(error) {
    console.error("[updateStatus] Failed to fetch or parse /status:", error);
    return;
}




try {
    if(!data.storage){
        throw new Error("/status response is missing storage data");
    }
    document.getElementById("storage").textContent =
        `${data.storage.free}GB / ${data.storage.total}GB`;
} catch(error) {
    console.error("[updateStatus] Failed to update storage display:", error);
}






try {
    labels.push("");
    tempData.push(data.temperature ?? null);
    luxData.push(data.lux ?? null);

    if(labels.length > 30){
        labels.shift();
        tempData.shift();
        luxData.shift();
    }

    tempChart.update();
    luxChart.update();
} catch(error) {
    console.error("[updateStatus] Failed to update temperature/light charts:", error);
}





try {
    if(!data.images || typeof data.images !== "object" || Array.isArray(data.images)){
        throw new Error("/status response is missing the images count object");
    }


const table =
document.getElementById("imageTable");



const groups=[

["1","A","B","C","D","E","R"],

["2","A","B","C","D","E","R"],

["3","A","B","C","D","E","R"],

["4","A","B","C","D","E","R"]

];




for(let r=0;r<4;r++){


for(let c=0;c<6;c++){



const key =
groups[r][0]
+
groups[r][c+1];



const count =
data.images[key] ?? 0;



table.rows[r+1]
.cells[c+1]
.innerHTML =

`<a href="/timeline/${key}">
${count}
</a>`;


}



}



document.getElementById("unknownCount")
.textContent =data.images["unknown"] ?? 0;

document.getElementById("deletedCount")
.textContent =data.images["deleted"] ?? 0;
} catch(error) {
    console.error("[updateStatus] Failed to update image counts:", error);
}

}

// ==========================
// Preview Label
// ==========================


function updateLabel(){


if(
!document.getElementById("useLabel").checked
){


document.getElementById("previewLabel")
.textContent="";


return;

}



const dish =
document.getElementById("dish").value;


const polyp =
document.getElementById("polyp").value;



document.getElementById("previewLabel")
.textContent =

dish + polyp;



}





document.getElementById("dish")
.onchange =
updateLabel;


document.getElementById("polyp")
.onchange =
updateLabel;


document.getElementById("useLabel")
.onchange =
updateLabel;






// ==========================
// Start
// ==========================


updateLabel();

updateStatus();


setInterval(
updateStatus,
1000
);






// ==========================
// Wake Lock
// ==========================


let wakeLock = null;



async function requestWakeLock(){


if(
!("wakeLock" in navigator)
){

return;

}



try{


wakeLock =
await navigator.wakeLock.request(
"screen"
);


console.log(
"Wake Lock ON"
);



}catch(err){


console.log(err);


}



}




requestWakeLock();




document.addEventListener(
"visibilitychange",
()=>{


if(
document.visibilityState
===
"visible"
){


requestWakeLock();


}


}

);



</script>
